<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Diamond Price Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="container">
    <h1>💎 Diamond Price Predictor</h1>
    <p class="subtitle">
        Enter diamond characteristics to estimate its market price using ML
    </p>

    <form action="{{ url_for('predict_datapoint') }}" method="POST">
        <div class="form-grid">

            <div class="form-group">
                <label>Carat</label>
                <input type="number" step="0.01" name="carat" required>
            </div>

            <div class="form-group">
                <label>Cut</label>
                <select name="cut" required>
                    <option value="">Select</option>
                    <option value="Ideal">Ideal</option>
                    <option value="Premium">Premium</option>
                    <option value="Very Good">Very Good</option>
                    <option value="Good">Good</option>
                    <option value="Fair">Fair</option>
                </select>
            </div>

            <div class="form-group">
                <label>Color</label>
                <select name="color" required>
                    <option value="">Select</option>
                    <option>D</option><option>E</option><option>F</option>
                    <option>G</option><option>H</option><option>I</option><option>J</option>
                </select>
            </div>

            <div class="form-group">
                <label>Clarity</label>
                <select name="clarity" required>
                    <option value="">Select</option>
                    <option>IF</option><option>VVS1</option><option>VVS2</option>
                    <option>VS1</option><option>VS2</option>
                    <option>SI1</option><option>SI2</option>
                </select>
            </div>

            <div class="form-group">
                <label>Depth</label>
                <input type="number" step="0.1" name="depth" required>
            </div>

            <div class="form-group">
                <label>Table</label>
                <input type="number" step="0.1" name="table" required>
            </div>

            <div class="form-group">
                <label>X (mm)</label>
                <input type="number" step="0.01" name="x" required>
            </div>

            <div class="form-group">
                <label>Y (mm)</label>
                <input type="number" step="0.01" name="y" required>
            </div>

            <div class="form-group">
                <label>Z (mm)</label>
                <input type="number" step="0.01" name="z" required>
            </div>

        </div>

        <button type="submit" class="btn">Predict Price</button>
    </form>

   {% if results %}
<div class="result-card">
    <p class="result-label">Estimated Diamond Price</p>
    <p class="result-value">₹ {{ results }}</p>
    <p class="result-note">
        Based on trained ML model (R² ≈ 0.98)
    </p>
</div>
{% endif %}
</div>

</body>
</html>
